<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <g id="bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
    <rect x="0" y="0" width="1280" height="720" fill="#F7F9FC" fill-opacity="0.5"/>
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
    <line x1="632" y1="150" x2="632" y2="595" stroke="#D9E1EC" stroke-width="1.5"/>
  </g>

  <!-- Header -->
  <g id="header">
    <rect x="0" y="0" width="1280" height="96" fill="#003366"/>
    <rect x="0" y="92" width="1280" height="4" fill="#1565C0"/>
    <text x="40" y="36" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#A9C2DD">TWSE｜證券交易所行情傳輸宣導</text>
    <text x="40" y="76" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF">行情線路頻寬現況與改善建議</text>
    <rect x="950" y="26" width="290" height="44" rx="10" fill="#FFFFFF" fill-opacity="0.12"/>
    <use data-icon="tabler-outline/activity-heartbeat" x="968" y="38" width="20" height="20" fill="#FFFFFF" stroke-width="2"/>
    <text x="998" y="54" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#FFFFFF">尖峰時段　6/25 09:05</text>
  </g>

  <!-- LEFT: traffic chart -->
  <g id="chart-traffic">
    <rect x="40" y="118" width="5" height="22" rx="2" fill="#1565C0"/>
    <text x="56" y="137" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="24" font-weight="bold" fill="#003366">現況｜各 IP 尖峰流量 <tspan font-size="15" font-weight="normal" fill="#5B6B7B">(單位:Mbps)</tspan></text>
    <g id="chartArea">
      <!-- Grid lines -->
      <line x1="85" y1="254" x2="605" y2="254" stroke="#E3E9F2" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="85" y1="326" x2="605" y2="326" stroke="#E3E9F2" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="85" y1="398" x2="605" y2="398" stroke="#E3E9F2" stroke-width="1" stroke-dasharray="4,4"/>
      <!-- Axes -->
      <line x1="85" y1="254" x2="85" y2="470" stroke="#94A3B8" stroke-width="2"/>
      <line x1="85" y1="470" x2="605" y2="470" stroke="#94A3B8" stroke-width="2"/>
      <!-- chart-plot-area: 85,254,605,470 -->
      <!-- Y labels -->
      <text x="76" y="474" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#5B6B7B" text-anchor="end">0</text>
      <text x="76" y="402" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#5B6B7B" text-anchor="end">4</text>
      <text x="76" y="330" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#5B6B7B" text-anchor="end">8</text>
      <text x="76" y="258" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#5B6B7B" text-anchor="end">12</text>
      <!-- Bar 1: IP1 8 -->
      <g id="bar-1">
        <rect x="123" y="326" width="46" height="144" rx="3" fill="#1565C0"/>
        <text x="146" y="318" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">8</text>
        <text x="146" y="491" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#5B6B7B" text-anchor="middle">第一 IP</text>
      </g>
      <!-- Bar 2: IP2 12 -->
      <g id="bar-2">
        <rect x="224" y="254" width="46" height="216" rx="3" fill="#1565C0"/>
        <text x="247" y="246" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">12</text>
        <text x="247" y="491" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#5B6B7B" text-anchor="middle">第二 IP</text>
      </g>
      <!-- Bar 3: IP3 3 -->
      <g id="bar-3">
        <rect x="325" y="416" width="46" height="54" rx="3" fill="#00897B"/>
        <text x="348" y="408" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1F2937" text-anchor="middle">3</text>
        <text x="348" y="491" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#5B6B7B" text-anchor="middle">第三 IP</text>
      </g>
      <!-- Bar 4: IP4 0.3 -->
      <g id="bar-4">
        <rect x="426" y="465" width="46" height="5" rx="2" fill="#90A4AE"/>
        <text x="449" y="456" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#5B6B7B" text-anchor="middle">0.3</text>
        <text x="449" y="491" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#5B6B7B" text-anchor="middle">第四 IP</text>
      </g>
      <!-- Bar 5: IP5 0.4 -->
      <g id="bar-5">
        <rect x="527" y="463" width="46" height="7" rx="2" fill="#90A4AE"/>
        <text x="550" y="456" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#5B6B7B" text-anchor="middle">0.4</text>
        <text x="550" y="491" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#5B6B7B" text-anchor="middle">第五 IP</text>
      </g>
    </g>
    <!-- Legend -->
    <g id="chart-legend">
      <rect x="95" y="514" width="14" height="14" rx="2" fill="#1565C0"/>
      <text x="114" y="526" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#5B6B7B">即時訊息(IP1·IP2)</text>
      <rect x="285" y="514" width="14" height="14" rx="2" fill="#00897B"/>
      <text x="304" y="526" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#5B6B7B">快照訊息(IP3)</text>
      <rect x="445" y="514" width="14" height="14" rx="2" fill="#90A4AE"/>
      <text x="464" y="526" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#5B6B7B">其他(IP4·IP5)</text>
    </g>
  </g>

  <!-- LEFT: escalation flow -->
  <g id="escalation">
    <rect x="40" y="562" width="166" height="90" rx="12" fill="#F7F9FC" stroke="#D9E1EC" stroke-width="1.5"/>
    <text x="58" y="592" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#5B6B7B">5 IP 合計</text>
    <text x="58" y="632" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1565C0">23.7<tspan font-size="14" font-weight="normal" fill="#5B6B7B"> Mbps</tspan></text>
    <text x="210" y="620" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="26" fill="#90A4AE">→</text>
    <rect x="228" y="562" width="166" height="90" rx="12" fill="#F7F9FC" stroke="#D9E1EC" stroke-width="1.5"/>
    <text x="246" y="592" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#5B6B7B">含 OTC 流量</text>
    <text x="246" y="632" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="28" font-weight="bold" fill="#003366">≈30<tspan font-size="14" font-weight="normal" fill="#5B6B7B"> Mbps</tspan></text>
    <text x="400" y="620" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="26" fill="#90A4AE">→</text>
    <rect x="416" y="562" width="184" height="90" rx="12" fill="#C62828" fill-opacity="0.08" stroke="#C62828" stroke-width="1.5"/>
    <use data-icon="tabler-outline/alert-triangle" x="434" y="576" width="18" height="18" fill="#C62828" stroke-width="2"/>
    <text x="458" y="590" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#C62828">同收兩條線路</text>
    <text x="434" y="632" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="26" font-weight="bold" fill="#C62828">&gt;50<tspan font-size="13" font-weight="normal"> Mbps · 超過上限</tspan></text>
  </g>

  <!-- RIGHT: recommendations -->
  <g id="rec-header">
    <rect x="650" y="118" width="5" height="22" rx="2" fill="#1565C0"/>
    <text x="666" y="137" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="24" font-weight="bold" fill="#003366">改善建議｜頻寬不足因應</text>
  </g>

  <g id="rec-1">
    <rect x="650" y="156" width="590" height="132" rx="12" fill="#F7F9FC" stroke="#D9E1EC" stroke-width="1.5"/>
    <circle cx="690" cy="196" r="21" fill="#1565C0"/>
    <text x="690" y="204" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <use data-icon="tabler-outline/arrows-split" x="730" y="180" width="22" height="22" fill="#1565C0" stroke-width="2"/>
    <text x="762" y="198" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="19" font-weight="bold" fill="#003366">即時／快照　擇一接收</text>
    <text x="730" y="234" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#1F2937">第一·第二 IP 為「<tspan font-weight="bold" fill="#1565C0">即時訊息</tspan>」,第三 IP 為「<tspan font-weight="bold" fill="#00897B">快照訊息</tspan>」。</text>
    <text x="730" y="262" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#1F2937">資訊商應依自身線路頻寬與需求,擇一接收。</text>
  </g>

  <g id="rec-2">
    <rect x="650" y="308" width="590" height="132" rx="12" fill="#F7F9FC" stroke="#D9E1EC" stroke-width="1.5"/>
    <circle cx="690" cy="348" r="21" fill="#1565C0"/>
    <text x="690" y="356" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <use data-icon="tabler-outline/route" x="730" y="332" width="22" height="22" fill="#1565C0" stroke-width="2"/>
    <text x="762" y="350" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="19" font-weight="bold" fill="#003366">依業務需求分流接收</text>
    <text x="730" y="386" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#1F2937">依業務需求<tspan font-weight="bold" fill="#1565C0">分流接收</tspan>,</text>
    <text x="730" y="414" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#1F2937">或僅接收<tspan font-weight="bold" fill="#1565C0">一份</tspan>行情資訊,降低線路負載。</text>
  </g>

  <g id="rec-3">
    <rect x="650" y="460" width="590" height="132" rx="12" fill="#F7F9FC" stroke="#D9E1EC" stroke-width="1.5"/>
    <circle cx="690" cy="500" r="21" fill="#2E7D32"/>
    <text x="690" y="508" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
    <use data-icon="tabler-outline/gauge" x="730" y="484" width="22" height="22" fill="#2E7D32" stroke-width="2"/>
    <text x="762" y="502" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="19" font-weight="bold" fill="#003366">提升硬體線路頻寬</text>
    <text x="730" y="538" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#1F2937">電作部已於去年 <tspan font-weight="bold" fill="#003366">12 月底發文</tspan>,</text>
    <text x="730" y="566" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#1F2937">全市場可申請 <tspan font-weight="bold" fill="#2E7D32">70M／100M</tspan> 線路升速。</text>
  </g>

  <g id="link-cta">
    <rect x="650" y="606" width="590" height="46" rx="10" fill="#1565C0" fill-opacity="0.08" stroke="#1565C0" stroke-width="1.2"/>
    <use data-icon="tabler-outline/external-link" x="666" y="620" width="20" height="20" fill="#1565C0" stroke-width="2"/>
    <text x="696" y="634" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#1565C0">申請參考:dsp.twse.com.tw/official/showDetail/04BFB3A4DBC211F0AC832D9568472C08</text>
  </g>

  <!-- Footer -->
  <g id="footer">
    <text x="40" y="688" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="11" fill="#90A4AE">資料來源:臺灣證券交易所 行情傳輸統計(2026/6/25 09:05 尖峰)　·　OTC 為櫃買中心行情</text>
  </g>
</svg>
